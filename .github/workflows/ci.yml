name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  DISTRIBUTION: 'temurin'

jobs:
  lint:
    name: Lint Check (FE & BE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: maven

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run lint checks
        run: make lint

  arch-guard:
    name: Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: maven

      - name: Run architecture guard
        run: make arch-guard

  modulith-check:
    name: Spring Modulith Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Verify Modulith structure
        run: make check-modulith

  test-domain:
    name: Domain Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: maven

      - name: Run domain unit tests
        run: make test-domain

      - name: Generate JaCoCo coverage report
        run: cd backend && ./mvnw jacoco:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/target/site/jacoco/jacoco.xml
          flags: domain-tests
          fail_below_threshold: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk security scan (Node.js)
        uses: snyk/actions/node@master
        with:
          args: --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Fashion-Graduation-Thesis'
          path: 'backend'
          format: 'HTML'
        continue-on-error: true

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t fashion-backend:test ./backend

      - name: Build frontend Docker image
        run: docker build -t fashion-frontend:test ./frontend

      - name: Build AI service Docker image
        run: docker build -t fashion-ai-service:test ./ai-service

      - name: Verify Docker images
        run: |
          docker images | grep fashion-
          echo "✅ All Docker images built successfully!"

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, arch-guard, modulith-check, test-domain, security-scan, docker-build]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.arch-guard.result }}" != "success" ] || \
             [ "${{ needs.modulith-check.result }}" != "success" ] || \
             [ "${{ needs.test-domain.result }}" != "success" ]; then
            echo "❌ CI pipeline failed!"
            echo ""
            echo "Job Results:"
            echo "  Lint: ${{ needs.lint.result }}"
            echo "  Arch-Guard: ${{ needs.arch-guard.result }}"
            echo "  Modulith: ${{ needs.modulith-check.result }}"
            echo "  Test-Domain: ${{ needs.test-domain.result }}"
            echo "  Security-Scan: ${{ needs.security-scan.result }}"
            echo "  Docker-Build: ${{ needs.docker-build.result }}"
            exit 1
          else
            echo "✅ All CI checks passed!"
            echo ""
            echo "Job Results:"
            echo "  Lint: ${{ needs.lint.result }}"
            echo "  Arch-Guard: ${{ needs.arch-guard.result }}"
            echo "  Modulith: ${{ needs.modulith-check.result }}"
            echo "  Test-Domain: ${{ needs.test-domain.result }}"
            echo "  Security-Scan: ${{ needs.security-scan.result }}"
            echo "  Docker-Build: ${{ needs.docker-build.result }}"
          fi