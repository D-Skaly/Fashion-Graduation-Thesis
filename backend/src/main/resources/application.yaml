spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # Default to dev profile
  application:
    name: fashion-backend
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-set}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-set}
            scope:
              - email
              - profile
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/fashion_db?options=-c%20timezone=UTC
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          enabled: true
          options:
            model: gemini-3-flash-preview
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384

server:
  port: 8080
logging:
  level:
    org.springframework.ai: DEBUG

application:
  ai:
    assistant:
      enabled: ${AI_ASSISTANT_ENABLED:false}
      max-message-length: ${AI_ASSISTANT_MAX_MESSAGE_LENGTH:1000}
      retry:
        max-attempts: ${AI_ASSISTANT_RETRY_MAX_ATTEMPTS:3}
        backoff-ms: ${AI_ASSISTANT_RETRY_BACKOFF_MS:250}
      timeout:
        response-ms: ${AI_ASSISTANT_TIMEOUT_MS:8000}
      rate-limit:
        enabled: ${AI_ASSISTANT_RATE_LIMIT_ENABLED:true}
        max-requests: ${AI_ASSISTANT_RATE_LIMIT_MAX_REQUESTS:20}
        window-seconds: ${AI_ASSISTANT_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:change-me-in-production}
      expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true
