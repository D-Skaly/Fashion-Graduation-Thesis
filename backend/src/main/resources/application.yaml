spring:
  main:
    allow-bean-definition-overriding: true
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # Default to dev profile
  application:
    name: fashion-backend
  modulith:
    events:
      externalize:
        enabled: true
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-set}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-set}
            scope:
              - email
              - profile
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/fashion_db_dev?options=-c%20timezone=UTC}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    service:
      url: ${AI_SERVICE_URL:http://localhost:8001}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          enabled: true
          options:
            model: gemini-3-flash-preview
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384
    mcp:
      client:
        enabled: true

server:
  port: 8080
logging:
  level:
    org.springframework.ai: DEBUG

application:
  gemini:
    rest:
      # Bật true để dùng REST Generative Language API trực tiếp (GeminiAIAdapter) thay vì Spring AI ChatClient.
      enabled: ${GEMINI_REST_ENABLED:true}
      api-key: ${GEMINI_API_KEY:}
      model: ${AI_MODEL:gemini-1.5-flash}
      read-timeout: 30s
  ai:
    assistant:
      enabled: ${AI_ASSISTANT_ENABLED:true}
      max-message-length: ${AI_ASSISTANT_MAX_MESSAGE_LENGTH:1000}
      retry:
        max-attempts: ${AI_ASSISTANT_RETRY_MAX_ATTEMPTS:3}
        backoff-ms: ${AI_ASSISTANT_RETRY_BACKOFF_MS:250}
      timeout:
        response-ms: ${AI_ASSISTANT_TIMEOUT_MS:8000}
      rate-limit:
        enabled: ${AI_ASSISTANT_RATE_LIMIT_ENABLED:true}
        max-requests: ${AI_ASSISTANT_RATE_LIMIT_MAX_REQUESTS:20}
        window-seconds: ${AI_ASSISTANT_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
    security:
      jwt:
        secret-key: ${JWT_SECRET_KEY:}
        expiration: ${JWT_EXPIRATION:86400000}
    payment:
      vnpay:
        tmn-code: ${VNPAY_TMN_CODE:}
        hash-secret: ${VNPAY_HASH_SECRET:}
        url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
        api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      momo:
        partner-code: ${MOMO_PARTNER_CODE:}
        access-key: ${MOMO_ACCESS_KEY:}
        secret-key: ${MOMO_SECRET_KEY:}
        endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}

resilience4j:
  circuitbreaker:
    instances:
      aiAssistant:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      aiAssistant:
        maxAttempts: ${AI_ASSISTANT_RETRY_MAX_ATTEMPTS:3}
        waitDuration: ${AI_ASSISTANT_RETRY_BACKOFF_MS:250ms}
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  timelimiter:
    instances:
      aiAssistant:
        timeoutDuration: ${AI_ASSISTANT_TIMEOUT_MS:8s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    defaults:
      enabled: true
