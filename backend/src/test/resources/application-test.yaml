# Profile "test": dùng cùng Flyway/schema PostgreSQL (vector) qua Testcontainers — xem PostgresIntegrationSupport.
spring:
  docker:
    compose:
      enabled: false
  mail:
    host: localhost
    port: 1025
    username: test@localhost
    password: test
    from: noreply@test.local
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jpa:
    hibernate:
      # Flyway giữ schema cốt lõi; các bảng/entity mới (vd. try-on) có thể chưa có migration.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

