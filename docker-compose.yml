services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: fashion-postgres
    environment:
      POSTGRES_DB: fashion_db_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: UTC
    command: postgres -c timezone=UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: fashion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fashion-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
    container_name: fashion-ai-service
    ports:
      - "8001:8001"
    environment:
      - TZ=UTC
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data:
